[project]
name = "portfolio-core"
version = "0.1.0"
description = "Shared utilities for the projects in this data portfolio."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Arantxa Garfella Esparza" }]

# Deliberately tiny. Project-specific libraries (scikit-learn, statsmodels,
# xgboost, ...) are declared by each project, not here, so that a change of
# mind in one project cannot break the others.
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
# Per-project groups: a change of mind in one project cannot break the others.
product-analytics = [
    "duckdb>=1.1",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_core"]

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
python_files = ["test_*.py"]
# Each project's src/ is importable by its own tests without being packaged:
# these are analyses, not libraries anyone installs.
pythonpath = ["src", "projects/01-product-analytics/src"]
addopts = "-q --strict-markers"

# --- Lint / format ---------------------------------------------------------
# Ruff replaces black + flake8 + isort with one tool and one config.
[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import order
    "B",        # bugbear: likely bugs (mutable default args, ...)
    "UP",       # pyupgrade: modern syntax
    "PD",       # pandas-vet: common pandas footguns
    "NPY",      # numpy-specific rules
    "RUF",
]
[tool.ruff.lint.per-file-ignores]
# Notebook-style scratch inside a project's exploratory scripts may keep
# unused imports around while a cell is being built.
"**/notebooks/**" = ["E402", "F401"]
