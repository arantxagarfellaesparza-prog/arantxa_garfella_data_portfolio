name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # --locked, not --frozen. --frozen installs whatever the lockfile says and
      # never looks at pyproject.toml, so a dependency added by hand is silently
      # not installed and CI still passes. --locked resolves and fails if the
      # lockfile no longer matches pyproject.toml, which is the check we want.
      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
